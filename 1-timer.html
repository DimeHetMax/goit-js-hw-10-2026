<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" crossorigin src="/goit-js-hw-10-2026/1-timer.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10-2026/assets/styles-DbmeCWnT.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10-2026/assets/vendor-MKyBg1n4.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10-2026/assets/styles-CEmM_x8x.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10-2026/assets/vendor-CgoBXKWG.css">
  </head>
  <body>
    <main>
      <section>
        <div class="container">
          <input type="text" id="datetime-picker" />
          <button type="button" data-start>Start</button>

          <div class="timer">
            <div class="field">
              <span class="value" data-days>00</span>
              <span class="label">Days</span>
            </div>
            <div class="field">
              <span class="value" data-hours>00</span>
              <span class="label">Hours</span>
            </div>
            <div class="field">
              <span class="value" data-minutes>00</span>
              <span class="label">Minutes</span>
            </div>
            <div class="field">
              <span class="value" data-seconds>00</span>
              <span class="label">Seconds</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
